<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { font-size: 20px; margin: 30px 0 12px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .panel { margin: 22px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #162435; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    code { color: #8ad8df; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    input, textarea { font: inherit; color: #ecf4ff; background: #0d1622; border: 1px solid #51667c; border-radius: 10px; padding: 10px 12px; }
    textarea { min-height: 70px; resize: vertical; }
    button { font: inherit; font-weight: 700; cursor: pointer; color: #101a28; background: #8ad8df; border: 0; border-radius: 10px; padding: 9px 14px; }
    button.ghost { color: #ecf4ff; background: transparent; border: 1px solid #51667c; }
    button.danger { color: #ffe3e8; background: #7a2e3c; }
    button:disabled { opacity: .5; cursor: wait; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .status { font-size: 15px; color: #bfd0e5; margin: 0; }
    .error { color: #ffb3c0; font-size: 15px; margin: 6px 0 0; min-height: 1.4em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로</div>
    <h1>점령된 자료실</h1>
    <p>메모는 서버 함수(<code>/api/notes</code>)가 로그인 토큰을 확인하고, 요청한 사람이 그 메모의 주인일 때만 돌려줍니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">5단계: 이 화면은 자료 저장소를 직접 부르지 않습니다. 로그인과 메모 요청은 모두 이 사이트의 서버 함수를 거치고, 서버가 로그인과 메모 주인을 확인합니다.</div>

    <section class="panel" id="login-panel">
      <h2 style="margin-top:0">로그인</h2>
      <form id="login-form">
        <label>이메일 <input name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
        <div class="row"><button type="submit">로그인</button></div>
        <p class="error" id="login-error" role="alert"></p>
      </form>
    </section>

    <section class="panel" id="session-panel" hidden>
      <p class="status" id="session-status"></p>
      <div class="row"><button type="button" class="ghost" id="logout">로그아웃</button></div>
    </section>

    <section id="notes-section" hidden>
      <h2>내 가상 메모</h2>
      <div class="panel">
        <form id="note-form">
          <label>제목 <input name="title" maxlength="100" required></label>
          <label>내용 <textarea name="body" maxlength="2000"></textarea></label>
          <div class="row">
            <button type="submit" id="note-submit">추가</button>
            <button type="button" class="ghost" id="note-cancel" hidden>수정 취소</button>
          </div>
          <p class="error" id="note-error" role="alert"></p>
        </form>
      </div>
      <ul id="notes" aria-live="polite"></ul>
    </section>

    <p class="status" id="guest-status">로그인하지 않으면 자료가 보이지 않습니다.</p>
  </main>

  <script type="module">
    // 5단계: 이 화면은 자료 저장소(Supabase) 주소·키를 모릅니다.
    // 로그인·로그아웃·메모 요청은 모두 같은 사이트의 서버 함수(/api/…)로만 보냅니다.
    const SESSION_KEY = 'byteback.session';
    const $ = selector => document.querySelector(selector);
    const loginPanel = $('#login-panel');
    const sessionPanel = $('#session-panel');
    const notesSection = $('#notes-section');
    const guestStatus = $('#guest-status');
    const list = $('#notes');
    const noteForm = $('#note-form');
    let session = null;
    let editingId = null;

    function saveSession(value) {
      try {
        if (value) sessionStorage.setItem(SESSION_KEY, JSON.stringify(value));
        else sessionStorage.removeItem(SESSION_KEY);
      } catch { /* 저장소를 못 쓰면 이 탭의 메모리에서만 유지 */ }
    }

    function loadSession() {
      try {
        const value = JSON.parse(sessionStorage.getItem(SESSION_KEY) ?? 'null');
        if (value?.access_token && (!value.expires_at || value.expires_at * 1000 > Date.now())) return value;
      } catch { /* 무시 */ }
      return null;
    }

    async function api(path, options = {}) {
      const headers = { Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}) };
      if (session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
      const response = await fetch(path, { ...options, headers, cache: 'no-store' });
      const data = await response.json().catch(() => null);
      if (response.status === 401 && session) {
        // 토큰이 만료되었거나 거부됨 → 로그인 화면으로
        saveSession(null);
        render(null);
        throw new Error('로그인이 끝났습니다. 다시 로그인해 주세요.');
      }
      if (!response.ok) throw new Error(data?.message ?? `요청 실패 (HTTP ${response.status})`);
      return data;
    }

    function showMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    function resetForm() {
      editingId = null;
      noteForm.reset();
      $('#note-submit').textContent = '추가';
      $('#note-cancel').hidden = true;
      $('#note-error').textContent = '';
    }

    async function loadNotes() {
      showMessage('가상 자료를 불러오는 중입니다.');
      try {
        const notes = await api('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) return showMessage('아직 메모가 없습니다. 위에서 추가해 보세요.');
        list.replaceChildren(...notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const body = document.createElement('span');
          title.textContent = note.title;
          body.textContent = note.body;
          const row = document.createElement('div');
          row.className = 'row';
          const edit = document.createElement('button');
          edit.type = 'button'; edit.className = 'ghost'; edit.textContent = '수정';
          edit.addEventListener('click', () => {
            editingId = note.id;
            noteForm.title.value = note.title;
            noteForm.body.value = note.body;
            $('#note-submit').textContent = '수정 저장';
            $('#note-cancel').hidden = false;
            noteForm.title.focus();
          });
          const remove = document.createElement('button');
          remove.type = 'button'; remove.className = 'danger'; remove.textContent = '삭제';
          remove.addEventListener('click', async () => {
            if (!confirm(`「${note.title}」 메모를 지울까요?`)) return;
            remove.disabled = true;
            try {
              await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
              if (editingId === note.id) resetForm();
              await loadNotes();
            } catch (error) {
              remove.disabled = false;
              $('#note-error').textContent = `삭제 실패: ${error.message}`;
            }
          });
          row.append(edit, remove);
          item.append(title, body, row);
          return item;
        }));
      } catch (error) {
        showMessage(error.message);
      }
    }

    function render(nextSession) {
      session = nextSession;
      const signedIn = Boolean(session);
      loginPanel.hidden = signedIn;
      sessionPanel.hidden = !signedIn;
      notesSection.hidden = !signedIn;
      guestStatus.hidden = signedIn;
      if (signedIn) {
        $('#session-status').textContent = `${session.email ?? '로그인한 사용자'} 계정으로 로그인했습니다.`;
        loadNotes();
      } else {
        list.replaceChildren();
        resetForm();
      }
    }

    $('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      $('#login-error').textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value }),
          cache: 'no-store',
        });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data?.accessToken) {
          $('#login-error').textContent = `로그인 실패: ${data?.message ?? `HTTP ${response.status}`}`;
          return;
        }
        const next = { access_token: data.accessToken, expires_at: data.expiresAt, email: data.email };
        saveSession(next);
        form.reset();
        render(next);
      } catch {
        $('#login-error').textContent = '로그인 실패: 서버에 연결하지 못했습니다.';
      } finally {
        button.disabled = false;
      }
    });

    $('#logout').addEventListener('click', async () => {
      const token = session?.access_token;
      saveSession(null);
      render(null);
      if (token) {
        // 화면은 바로 로그아웃하고, 서버에 세션 종료를 알립니다.
        fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: `Bearer ${token}` } }).catch(() => {});
      }
    });

    $('#note-cancel').addEventListener('click', resetForm);

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      const button = $('#note-submit');
      $('#note-error').textContent = '';
      button.disabled = true;
      const payload = JSON.stringify({ title: noteForm.title.value, body: noteForm.body.value });
      try {
        if (editingId) {
          await api(`/api/notes/${encodeURIComponent(editingId)}`, { method: 'PUT', body: payload });
        } else {
          await api('/api/notes', { method: 'POST', body: payload });
        }
        resetForm();
        await loadNotes();
      } catch (error) {
        $('#note-error').textContent = `저장 실패: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    render(loadSession());
  </script>
</body>
</html>
